name: release

on:
  push:
    branches:
      - main
    paths:
      - "VERSION"

permissions: {}

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'GrantBirki/uninstall' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      artifact-name: ${{ steps.package.outputs.artifact }}

    steps:
      - name: restrict network
        uses: openai/fence@2cf00d32716021a106bb59fcdc1c978c22a3def3 # pin@v0.9.2
        with:
          mode: audit
          allow_github_artifacts: true

      - name: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # pin@v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: read version
        id: version
        run: |
          version=$(awk 'NF && $1 !~ /^#/ {print $1; exit}' VERSION)
          if [[ -z "$version" ]]; then
            echo "VERSION file is empty."
            exit 1
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be in X.Y.Z format; got ${version}."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: test
        run: |
          bash -n uninstall
          test/uninstall_test.sh

      - name: package
        id: package
        run: |
          version="${{ steps.version.outputs.version }}"
          if [[ ! -x "uninstall" ]]; then
            echo "Expected uninstall to be executable."
            exit 1
          fi

          mkdir -p dist
          artifact="uninstall-${version}.tar.gz"
          git archive --format=tar.gz --output="dist/${artifact}" HEAD
          sha256sum "dist/${artifact}" | awk '{print $1}' > "dist/${artifact}.sha256"
          echo "artifact=${artifact}" >> "$GITHUB_OUTPUT"

      - name: scan artifact for tokens
        run: |
          artifact="dist/${{ steps.package.outputs.artifact }}"
          if [[ ! -f "$artifact" ]]; then
            echo "Expected artifact not found at $artifact"
            exit 1
          fi

          scan_dir="$(mktemp -d)"
          trap 'rm -rf "$scan_dir"' EXIT
          tar -xzf "$artifact" -C "$scan_dir"

          if grep -R -a -E -n 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}' "$scan_dir" >/dev/null; then
            echo "Potential token found in release artifact (file paths only):"
            grep -R -a -E -l 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}' "$scan_dir"
            exit 1
          fi

      - name: upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # pin@v7.0.1
        id: upload-artifact
        with:
          name: dist
          path: dist/
          retention-days: 5
          if-no-files-found: error

  attest:
    needs: build
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: restrict network
        uses: openai/fence@2cf00d32716021a106bb59fcdc1c978c22a3def3 # pin@v0.9.2
        with:
          mode: audit
          allow_github_artifacts: true

      - name: download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: "dist/"

      - name: attest build provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # pin@v4.2.0
        with:
          subject-path: "dist/${{ needs.build.outputs.artifact-name }}"

  verify:
    needs: [build, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: restrict network
        uses: openai/fence@2cf00d32716021a106bb59fcdc1c978c22a3def3 # pin@v0.9.2
        with:
          mode: audit
          allow_github_artifacts: true

      - name: download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: "dist/"

      - name: verify
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          ARTIFACT_PATH: "dist/${{ needs.build.outputs.artifact-name }}"
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_DIGEST: ${{ github.sha }}
        run: |
          if [[ ! -f "$ARTIFACT_PATH" ]]; then
            echo "Expected artifact not found at $ARTIFACT_PATH"
            exit 1
          fi

          if [[ ! -f "${ARTIFACT_PATH}.sha256" ]]; then
            echo "Expected checksum not found at ${ARTIFACT_PATH}.sha256"
            exit 1
          fi

          expected_sha=$(cat "${ARTIFACT_PATH}.sha256")
          actual_sha=$(sha256sum "$ARTIFACT_PATH" | awk '{print $1}')
          if [[ "$expected_sha" != "$actual_sha" ]]; then
            echo "Checksum mismatch: expected $expected_sha but got $actual_sha"
            exit 1
          fi

          gh attestation verify "$ARTIFACT_PATH" \
            --repo "${OWNER}/${REPO}" \
            --signer-workflow "${OWNER}/${REPO}/.github/workflows/release.yml" \
            --signer-digest "$SOURCE_DIGEST" \
            --source-ref "$SOURCE_REF" \
            --source-digest "$SOURCE_DIGEST" \
            --deny-self-hosted-runners

  release:
    needs: [build, verify]
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: restrict network
        uses: openai/fence@2cf00d32716021a106bb59fcdc1c978c22a3def3 # pin@v0.9.2
        with:
          mode: audit
          allow_github_artifacts: true

      - name: download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: "dist/"

      - name: ensure tag does not exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set +e
          tag_lookup=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>&1)
          tag_lookup_status=$?
          set -e

          if [[ "$tag_lookup_status" -eq 0 ]]; then
            echo "Tag already exists: ${TAG}"
            exit 1
          fi

          if [[ "$tag_lookup" != *"HTTP 404"* ]]; then
            echo "Unable to confirm that tag ${TAG} does not exist."
            printf '%s\n' "$tag_lookup"
            exit 1
          fi

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$TAG" \
            "dist/uninstall-${VERSION}.tar.gz" \
            "dist/uninstall-${VERSION}.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

  release_info:
    needs: [build, release]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: restrict network
        uses: openai/fence@2cf00d32716021a106bb59fcdc1c978c22a3def3 # pin@v0.9.2
        with:
          mode: audit
          allow_github_artifacts: true

      - name: download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # pin@v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: "dist/"

      - name: print tap update info
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sha_file="dist/uninstall-${VERSION}.tar.gz.sha256"
          if [[ ! -f "$sha_file" ]]; then
            echo "Release info unavailable: expected checksum not found at $sha_file"
            exit 0
          fi

          sha=$(cat "$sha_file")
          if [[ ! "$sha" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "Release info unavailable: invalid SHA256 in $sha_file"
            exit 0
          fi

          green='\033[0;32m'
          blue='\033[0;34m'
          yellow='\033[0;33m'
          off='\033[0m'

          echo -e "${green}Homebrew tap update details:${off}"
          echo -e "  ${blue}version${off}: ${VERSION}"
          echo -e "  ${blue}sha256${off}: ${sha}"
          echo
          echo -e "${yellow}Formula snippet:${off}"
          cat <<RUBY
          class Uninstall < Formula
            desc "CLI tool for macOS to uninstall an app from your system"
            homepage "https://github.com/GrantBirki/uninstall"
            version "${VERSION}"
            url "https://github.com/GrantBirki/uninstall/releases/download/v#{version}/uninstall-#{version}.tar.gz"
            sha256 "${sha}"
            license "MIT"

            def install
              bin.install "uninstall"
            end

            test do
              system "#{bin}/uninstall", "--help"
            end
          end
          RUBY
